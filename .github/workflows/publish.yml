# Publishes to PyPI through a trusted publisher (no stored token), and attaches the
# Claude Desktop bundle to each release (job mcpb).
# PyPI side: project agentic-video, owner tlq5l, repo agentic-video,
# workflow publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      # MCP Registry (release only). These steps run after the PyPI upload, because the
      # registry checks the mcp-name marker in the PyPI description and the package version.
      # Docs: https://modelcontextprotocol.io/registry/github-actions.md (OIDC steps) and
      # https://modelcontextprotocol.io/registry/package-types.md (PyPI ownership marker).
      # Pinned to mcp-publisher v1.8.7, the latest release on 2026-10-31; the docs use
      # releases/latest. Bump server.json together with pyproject.toml.
      - name: Install mcp-publisher
        if: github.event_name == 'release'
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        if: github.event_name == 'release'
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        if: github.event_name == 'release'
        run: ./mcp-publisher publish

  # Attaches the Claude Desktop bundle (dist/agentic-video-<version>.mcpb) to the GitHub release.
  mcpb:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 scripts/build_mcpb.py
      - run: gh release upload "$RELEASE_TAG" dist/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
